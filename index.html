<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brasa Burger | Cardápio Digital</title>

<style>
:root {
  --red: #e34729;
  --dark: #211b19;
  --cream: #fff9f2;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--cream);
  font-family: system-ui, -apple-system, Segoe UI, sans-serif;
  color: var(--dark);
}

header {
  background: #241b19;
  color: white;
  padding: 28px 20px;
  text-align: center;
}

header .logo {
  font-size: 34px;
  font-weight: 900;
  letter-spacing: -1px;
}

header .logo span { color: #ffae58; }
header p { margin: 6px 0; color: #f3d6c1; }

.banner {
  background: #fce8d7;
  padding: 18px;
  text-align: center;
  font-weight: 650;
}

.wrap {
  max-width: 1060px;
  margin: auto;
  padding: 24px 16px 100px;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.top h1 { font-size: 26px; }

.pill {
  background: #eaf6e9;
  color: #256d36;
  padding: 7px 11px;
  border-radius: 100px;
  font-size: 13px;
}

.filters {
  display: flex;
  gap: 8px;
  overflow: auto;
  padding: 8px 0 24px;
}

.filters button {
  white-space: nowrap;
  border: 1px solid #e4d5c9;
  background: white;
  border-radius: 22px;
  padding: 10px 15px;
  cursor: pointer;
  font-weight: 650;
}

.filters button.active {
  background: var(--dark);
  color: white;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 16px;
}

.product {
  background: white;
  border: 1px solid #f0e1d6;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 5px 18px #3a1b0e0b;
}

.art {
  height: 150px;
  background: linear-gradient(135deg, #ffe0ac, #f4b87d);
  display: grid;
  place-items: center;
  font-size: 76px;
  overflow: hidden;
}

.art img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.info { padding: 16px; }
.info h3 { margin: 0 0 8px; }

.info p {
